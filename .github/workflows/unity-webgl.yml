name: Unity WebGL Prototype
on:
  workflow_dispatch:
  push:
    branches: [unity-prototype]
    paths: ['UnityProject/**','.github/workflows/unity-webgl.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          targetPlatform: WebGL
          unityVersion: 6000.0.62f1
          buildMethod: WebGLBuild.Build
      - uses: actions/upload-artifact@v4
        with:
          name: Lumber-Empire-WebGL
          path: UnityProject/Build/WebGL
