name: Unity WebGL Preview

on:
  push:
    branches: [unity-prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.6f1
          targetPlatform: WebGL
          buildsPath: build

      - name: Locate WebGL index
        id: webgl
        shell: bash
        run: |
          set -e
          INDEX="$(find build -type f -name index.html | head -n 1)"
          if [ -z "$INDEX" ]; then
            echo "No WebGL index.html found"
            find build -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi
          WEBGL_DIR="$(dirname "$INDEX")"
          echo "Found WebGL site at: $WEBGL_DIR"
          echo "dir=$WEBGL_DIR" >> "$GITHUB_OUTPUT"
          test -f "$WEBGL_DIR/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.webgl.outputs.dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
