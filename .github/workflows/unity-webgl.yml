name: Unity WebGL Preview

on:
  push:
    branches:
      - unity-prototype
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# During active development only the newest preview matters.
# Cancel an older build as soon as a newer commit is pushed instead of
# making every small gameplay change wait in a long queue.
concurrency:
  group: unity-webgl-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Enable GitHub Pages WebGL decompression fallback
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="ProjectSettings/ProjectSettings.asset"
          grep -q '^  webGLDecompressionFallback:' "$SETTINGS"
          sed -i 's/^  webGLDecompressionFallback: .*/  webGLDecompressionFallback: 1/' "$SETTINGS"
          grep '^  webGLDecompressionFallback: 1' "$SETTINGS"

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.6f1
          targetPlatform: WebGL
          buildsPath: build

      - name: Prepare Pages root
        shell: bash
        run: |
          set -euo pipefail
          INDEX=$(find build -type f -name index.html -print -quit)
          if [ -z "$INDEX" ]; then
            echo "Unity WebGL index.html was not found"
            exit 1
          fi
          SITE_DIR=$(dirname "$INDEX")
          echo "Publishing $SITE_DIR"
          mkdir -p pages-root
          cp -a "$SITE_DIR"/. pages-root/
          test -f pages-root/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
